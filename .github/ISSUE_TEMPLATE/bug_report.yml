name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Proxlio version
      description: Run `cat VERSION` or check the release tag you installed
      placeholder: "e.g. 0.3.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS / distro
      options:
        - Raspberry Pi OS
        - Ubuntu
        - Debian
        - Other
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - "curl | bash"
        - git clone
        - other
    validations:
      required: true

  - type: input
    id: docker_version
    attributes:
      label: Docker version
      description: Output of `docker --version`
      placeholder: "e.g. Docker version 27.1.1, build 6312585"
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run install script
        2. Open wizard at http://...
        3. Fill in domain
        4. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs here
      placeholder: "docker compose logs --tail=50"
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (network setup, reverse proxy, etc.)
    validations:
      required: false
