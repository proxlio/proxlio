name: Feature Request
description: Propose an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is this related to a problem?
      description: What's the frustration or limitation you're running into?
      placeholder: "e.g. I always have to manually update DNS rewrites after changing domains..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution
      description: What would you like to happen? Be as specific as you can.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Have you tried a workaround?
      description: If yes, describe it — this helps understand the gap.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, prior art, or anything else relevant.
    validations:
      required: false
